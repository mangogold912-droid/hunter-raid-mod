name: Build Modded APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp output
          gh release download v2.6.9-mod --repo mangogold912-droid/hunter-raid-mod -p 'base.apk' -D temp/ || true
          mv temp/base.apk temp/studio.gameberry.idlehunter.apk 2>/dev/null || true
          gh release download v2.6.9-mod --repo mangogold912-droid/hunter-raid-mod -p 'config.arm64_v8a.apk' -D temp/ || true
          gh release download v2.6.9-mod --repo mangogold912-droid/hunter-raid-mod -p 'libDeathLantern.so' || true
      
      - name: Build modded APK (no compression)
        run: |
          python3 << 'BUILD'
          import zipfile, os, struct
          
          print("=== Step 1: Merge split APKs ===")
          config_libs = {}
          with zipfile.ZipFile("temp/config.arm64_v8a.apk", "r") as z:
              for n in z.namelist():
                  if n.startswith("lib/arm64-v8a/"):
                      config_libs[n] = z.read(n)
          with open("libDeathLantern.so", "rb") as f:
              config_libs["lib/arm64-v8a/libDeathLantern.so"] = f.read()
          
          # Merge: copy base, add config libs
          with zipfile.ZipFile("temp/studio.gameberry.idlehunter.apk", "r") as zin:
              with zipfile.ZipFile("temp/merged.apk", "w") as zout:
                  for item in zin.infolist():
                      zout.writestr(item, zin.read(item))
                  for n, d in config_libs.items():
                      zout.writestr(n, d)
          print(f"  Merged: {os.path.getsize('temp/merged.apk')//1024//1024}MB")
          
          print("\n=== Step 2: Fix AndroidManifest.xml ===")
          # Read original manifest (binary AXML)
          with zipfile.ZipFile("temp/merged.apk", "r") as z:
              manifest = z.read("AndroidManifest.xml")
          
          # Remove split-related strings in binary AXML
          # Binary AXML contains string pool - replace offending strings
          fixes = [
              (b'requiredSplitTypes', b'x___________________'),
              (b'splitTypes',          b'x_________'),
              (b'com.android.vending.splits.required', b'com.android.vending.xxxxxxx.xxxxxxxx'),
              (b'com.android.vending.splits',          b'com.android.vending.xxxxxxx'),
          ]
          fixed_manifest = manifest
          for old, new in fixes:
              if old in fixed_manifest:
                  fixed_manifest = fixed_manifest.replace(old, new)
                  print(f"  Fixed: {old.decode()} -> {new.decode()}")
          
          # Also need to set the boolean value for splits.required from true to false
          # In AXML: find "splits.required" nearby boolean and set to 0
          # The meta-data value "true" near splits.required
          idx = fixed_manifest.find(b'com.android.vending.xxxxxxx.xxxxxxxx')
          if idx >= 0:
              # Find the value="true" pattern in the Res_value chunk after this string
              # Simpler: just remove the meta-data entries entirely  
              # Can't easily remove chunks from AXML without breaking offsets
              # Instead: change the value attribute name to hide it
              pass
          
          print(f"  Manifest: {len(manifest)} -> {len(fixed_manifest)} bytes")
          
          print("\n=== Step 3: Add ModLoader to DEX ===")
          # Find classes.dex or smallest dex to patch
          # Actually add a new minimal dex file with ModLoader
          # Simplest: patch existing smali by adding a new dex
          
          # Create minimal dex that calls System.loadLibrary when loaded
          # We'll modify the smallest classes file to add our code
          # For now, skip DEX patching and rely on existing mod loading
          print("  Skipping DEX patch (libDeathLantern.so already exists)")
          
          print("\n=== Step 4: Rebuild APK (STORED, no compression) ===")
          with zipfile.ZipFile("temp/merged.apk", "r") as zin:
              with zipfile.ZipFile("output/hunter-raid-mod-v2.7.1.apk", "w", zipfile.ZIP_STORED) as zout:
                  for item in zin.infolist():
                      if item.filename == "AndroidManifest.xml":
                          zout.writestr(item.filename, fixed_manifest)
                          print(f"  [PATCH] AndroidManifest.xml")
                      else:
                          data = zin.read(item.filename)
                          zout.writestr(item.filename, data, compress_type=zipfile.ZIP_STORED)
          
          size = os.path.getsize("output/hunter-raid-mod-v2.7.1.apk")
          print(f"\n  Final: {size//1024//1024}MB (all STORED)")
          BUILD
      
      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias deathlantern \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass deathlantern -keypass deathlantern \
            -dname "CN=DeathLantern,O=Mod,C=KR"
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore -storepass deathlantern -keypass deathlantern \
            output/hunter-raid-mod-v2.7.1.apk deathlantern
          
          echo "Signed:"
          ls -lh output/
      
      - name: Verify
        run: |
          jarsigner -verify output/hunter-raid-mod-v2.7.1.apk
          python3 -c "
          import zipfile
          with zipfile.ZipFile('output/hunter-raid-mod-v2.7.1.apk') as z:
              info = z.getinfo('AndroidManifest.xml')
              ct = 'STORED' if info.compress_type == 0 else 'DEFLATED'
              print(f'Manifest compression: {ct}')
              manifest = z.read('AndroidManifest.xml')
              print(f'requiredSplitTypes present: {b\"requiredSplitTypes\" in manifest}')
              print(f'vending.splits present: {b\"vending.splits\" in manifest}')
              print(f'libDeathLantern.so present: {\"lib/arm64-v8a/libDeathLantern.so\" in z.namelist()}')
          "
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HunterRaid-Mod-v2.7.1-DeathLantern
          path: output/hunter-raid-mod-v2.7.1.apk
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.1-mod
          name: "Hunter Raid v2.7.1 Mod - DeathLantern"
          body: |
            ## 헌터키우기 모딩 APK v2.7.1 — DeathLantern
            
            ✅ **무압춼(STORED) 빌드**
            ✅ **Split APK 의존성 제거**
            
            ### 설치
            1. 기존 앱 삭제
            2. APK 설치
            3. 출처를 알 수 없는 앱 허용
          files: output/hunter-raid-mod-v2.7.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
