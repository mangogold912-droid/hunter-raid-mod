name: Build Modded APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Install tools
        run: |
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar 2>/dev/null || true
          pip3 install androguard requests
      
      - name: Download files from release
        run: |
          mkdir -p temp output
          
          python3 << 'DOWNLOAD'
          import urllib.request, json, os, base64
          
          # Use the PAT from repository secrets or environment
          TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          REPO = "mangogold912-droid/hunter-raid-mod"
          
          headers = {
              "Authorization": f"token {TOKEN}",
              "Accept": "application/vnd.github.v3+json"
          }
          
          # Get release assets
          req = urllib.request.Request(
              f"https://api.github.com/repos/{REPO}/releases/tags/v2.6.9-mod",
              headers=headers
          )
          resp = urllib.request.urlopen(req)
          release = json.loads(resp.read())
          
          for asset in release.get('assets', []):
              name = asset['name']
              url = asset['url']  # Use API URL, not browser_download_url
              
              if name == 'base.apk':
                  dest = 'temp/studio.gameberry.idlehunter.apk'
              elif name == 'config.arm64_v8a.apk':
                  dest = 'temp/config.arm64_v8a.apk'
              else:
                  dest = name  # libDeathLantern.so -> current dir
              
              print(f"Downloading {name} -> {dest}...")
              req2 = urllib.request.Request(url, headers={
                  "Authorization": f"token {TOKEN}",
                  "Accept": "application/octet-stream"
              })
              resp2 = urllib.request.urlopen(req2)
              data = resp2.read()
              with open(dest, 'wb') as f:
                  f.write(data)
              print(f"  Done: {len(data)//1024//1024}MB")
          DOWNLOAD
          
          echo "Files:"
          ls -lh temp/ *.so 2>/dev/null
      
      - name: Merge and decompile
        run: |
          echo "Merging APKs..."
          python3 scripts/inject_mod.py
      
      - name: Build and sign
        run: |
          # Generate keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias deathlantern \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass deathlantern \
            -keypass deathlantern \
            -dname "CN=DeathLantern,O=Mod,C=KR"
          
          if [ -d "temp/decompiled" ]; then
            echo "Recompiling with apktool..."
            java -jar /usr/local/bin/apktool.jar b temp/decompiled -o output/unsigned.apk --use-aapt2
          else
            echo "Using direct merge..."
            python3 scripts/merge_only.py
          fi
          
          echo "Signing..."
          # Align
          zipalign -f 4 output/unsigned.apk output/aligned.apk 2>/dev/null || cp output/unsigned.apk output/aligned.apk
          
          # Sign (jarsigner as fallback)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore -storepass deathlantern -keypass deathlantern \
            output/aligned.apk deathlantern
          
          mv output/aligned.apk output/hunter-raid-mod-v2.7.1.apk
          ls -lh output/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HunterRaid-Mod-v2.7.1-DeathLantern
          path: output/hunter-raid-mod-v2.7.1.apk
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.1-mod
          name: "Hunter Raid v2.7.1 Mod - DeathLantern"
          body: |
            ## 헌터키우기 모딩 APK v2.7.1
            ### DeathLantern Edition
            
            **v2.6.9 → v2.7.1 이식**
            
            - libDeathLantern.so 런타임 훅
            - DEX 모드 로딩 코드 추가
            - Split APK → 단일 APK
            - 커스텀 서명
            
            ### 설치
            1. 기존 앱 삭제
            2. APK 설치
            3. 출처를 알 수 없는 앱 허용
          files: output/hunter-raid-mod-v2.7.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
