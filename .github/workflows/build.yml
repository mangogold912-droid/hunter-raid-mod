name: Build Modded APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Install tools
        run: |
          # Install apktool
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool 2>/dev/null || true
          chmod +x /usr/local/bin/apktool 2>/dev/null || true
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar 2>/dev/null || true
          
          # Install Python tools
          pip3 install androguard requests
          
          # Install Android build tools
          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -y -qq zipalign 2>/dev/null || true
          
          # Download Android build tools for apksigner
          echo "Installing Android SDK build tools..."
          mkdir -p $HOME/android-sdk
          wget -q "https://dl.google.com/android/repository/build-tools_r34-linux.zip" -O /tmp/build-tools.zip 2>/dev/null || true
          if [ -f /tmp/build-tools.zip ]; then
            unzip -q /tmp/build-tools.zip -d $HOME/android-sdk/build-tools 2>/dev/null || true
            export PATH="$HOME/android-sdk/build-tools/android-34:$PATH"
          fi
      
      - name: Download APK files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp output
          
          # Download from GitHub release
          python3 -c "
          import urllib.request, json, os
          
          TOKEN = os.environ.get('GH_TOKEN', '')
          REPO = 'mangogold912-droid/hunter-raid-mod'
          
          resp = urllib.request.urlopen(
              f'https://api.github.com/repos/{REPO}/releases/tags/v2.6.9-mod',
          )
          release = json.loads(resp.read())
          
          for asset in release.get('assets', []):
              name = asset['name']
              url = asset['browser_download_url']
              dest = f'temp/{name}' if name != 'base.apk' else f'temp/studio.gameberry.idlehunter.apk'
              print(f'Downloading {name}...')
              req = urllib.request.Request(url)
              resp2 = urllib.request.urlopen(req)
              with open(dest, 'wb') as f:
                  f.write(resp2.read())
              print(f'  -> {dest} ({os.path.getsize(dest)//1024//1024}MB)')
          "
          
          echo "Files downloaded:"
          ls -lh temp/
      
      - name: Merge and inject mod
        run: |
          export PATH="$HOME/android-sdk/build-tools/android-34:$PATH"
          python3 scripts/inject_mod.py
      
      - name: Build APK
        run: |
          export PATH="$HOME/android-sdk/build-tools/android-34:$PATH"
          
          # Generate keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias deathlantern \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass deathlantern \
            -keypass deathlantern \
            -dname "CN=DeathLantern,O=Mod,C=KR"
          
          # Recompile with apktool
          echo "Recompiling with apktool..."
          java -jar /usr/local/bin/apktool.jar b temp/decompiled -o output/unsigned.apk --use-aapt2 || {
            echo "apktool failed, trying direct merge..."
            # Fallback: direct zip merge approach
            python3 scripts/merge_only.py
          }
          
          echo "Signing APK..."
          # Align
          zipalign -f 4 output/unsigned.apk output/aligned.apk 2>/dev/null || cp output/unsigned.apk output/aligned.apk
          
          # Sign with apksigner (v2 signing)
          if command -v apksigner &> /dev/null; then
            apksigner sign --ks debug.keystore --ks-pass pass:deathlantern --key-pass pass:deathlantern --out output/hunter-raid-mod-v2.7.1.apk output/aligned.apk
          else
            # Fallback: jarsigner
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass deathlantern -keypass deathlantern output/aligned.apk deathlantern
            mv output/aligned.apk output/hunter-raid-mod-v2.7.1.apk
          fi
          
          echo "Build complete:"
          ls -lh output/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HunterRaid-Mod-v2.7.1-DeathLantern
          path: output/hunter-raid-mod-v2.7.1.apk
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.1-mod
          name: "Hunter Raid v2.7.1 Mod - DeathLantern"
          body: |
            ## 헌터키우기 모딩 APK v2.7.1
            ### DeathLantern Edition
            
            **v2.6.9 모딩 코드 → v2.7.1 이식**
            
            ### 모딩 내용
            - libDeathLantern.so 런타임 훅 삽입
            - DEX 수정 (모드 로딩)
            - Split APK → 단일 APK 병합
            - 커스텀 서명
            
            ### 설치
            1. 기존 앱 삭제
            2. APK 설치
            3. 출처를 알 수 없는 앱 허용
            
            > ⚠️ 서명 변경으로 원본 데이터 미호환
          files: output/hunter-raid-mod-v2.7.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
