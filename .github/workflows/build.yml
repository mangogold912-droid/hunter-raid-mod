name: Build Modded APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Install tools
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          pip3 install androguard requests
          sudo apt-get update -qq && sudo apt-get install -y -qq zipalign apksigner 2>/dev/null || true
      
      - name: Download APK
        run: |
          mkdir -p temp output
          echo "Downloading Hunter Raid v2.7.1 XAPK..."
          curl -sL "https://d.apkpure.net/b/APK/studio.gameberry.idlehunter?version=latest" -o temp/hunter.xapk
          
          echo "Extracting..."
          cd temp
          unzip -o hunter.xapk "studio.gameberry.idlehunter.apk" "config.arm64_v8a.apk"
          rm hunter.xapk
          ls -lh
      
      - name: Download mod library
        run: |
          # Download libDeathLantern.so from release
          python3 -c "
          import urllib.request, json
          resp = urllib.request.urlopen('https://api.github.com/repos/mangogold912-droid/hunter-raid-mod/releases/tags/v2.6.9-mod')
          release = json.loads(resp.read())
          for asset in release.get('assets', []):
              if asset['name'] == 'libDeathLantern.so':
                  urllib.request.urlretrieve(asset['browser_download_url'], 'libDeathLantern.so')
                  print(f'Downloaded {asset["name"]}')
                  break
          "
          ls -lh libDeathLantern.so
      
      - name: Merge APKs into single APK
        run: |
          python3 << 'MERGE'
          import zipfile, os
          
          base = "temp/studio.gameberry.idlehunter.apk"
          config = "temp/config.arm64_v8a.apk"
          output = "temp/merged.apk"
          
          # Read config libs
          config_libs = {}
          with zipfile.ZipFile(config, 'r') as z:
              for name in z.namelist():
                  if name.startswith('lib/'):
                      config_libs[name] = z.read(name)
          
          # Read mod lib
          with open("libDeathLantern.so", 'rb') as f:
              config_libs['lib/arm64-v8a/libDeathLantern.so'] = f.read()
          
          # Merge
          with zipfile.ZipFile(base, 'r') as zin:
              with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.namelist():
                      zout.writestr(item, zin.read(item))
                  for name, data in config_libs.items():
                      zout.writestr(name, data)
          
          print(f"Merged APK: {os.path.getsize(output)//1024//1024}MB")
          MERGE
      
      - name: Decompile with apktool
        run: |
          java -jar /usr/local/bin/apktool.jar d temp/merged.apk -o temp/decompiled -f -s
          echo "Decompiled successfully"
          ls temp/decompiled/
      
      - name: Inject mod loading code
        run: |
          # Create smali file for mod loading
          mkdir -p temp/decompiled/smali_classes6/com/deathlantern
          
          cat > temp/decompiled/smali_classes6/com/deathlantern/ModLoader.smali << 'SMALI'
          .class public Lcom/deathlantern/ModLoader;
          .super Ljava/lang/Object;
          
          .method public static loadMod()V
              .locals 1
              const-string v0, "DeathLantern"
              invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V
              return-void
          .end method
          SMALI
          
          echo "ModLoader.smali created"
          
          # Find and patch MessagingUnityPlayerActivity
          # We need to add ModLoader.loadMod() call in onCreate
          python3 << 'PATCH'
          import os, glob
          
          # Find MessagingUnityPlayerActivity smali
          smali_dirs = glob.glob("temp/decompiled/smali*/com/google/firebase/MessagingUnityPlayerActivity.smali")
          
          for smali_file in smali_dirs:
              with open(smali_file, 'r') as f:
                  content = f.read()
              
              if 'onCreate' in content:
                  # Add ModLoader.loadMod() at the start of onCreate
                  content = content.replace(
                      '.method public onCreate(Landroid/os/Bundle;)V',
                      '.method public onCreate(Landroid/os/Bundle;)V\n    .locals 1\n    invoke-static {}, Lcom/deathlantern/ModLoader;->loadMod()V'
                  )
                  # Fix: proper smali syntax
                  content = content.replace(
                      '.method public onCreate(Landroid/os/Bundle;)V\n    .locals 1\n    invoke-static {}, Lcom/deathlantern/ModLoader;->loadMod()V',
                      '.method public onCreate(Landroid/os/Bundle;)V\n    .locals 2\n    invoke-static {}, Lcom/deathlantern/ModLoader;->loadMod()V'
                  )
                  
                  with open(smali_file, 'w') as f:
                      f.write(content)
                  print(f"Patched: {smali_file}")
          
          # Also patch UnityPlayerActivity
          unity_dirs = glob.glob("temp/decompiled/smali*/com/unity3d/player/UnityPlayerActivity.smali")
          for smali_file in unity_dirs:
              with open(smali_file, 'r') as f:
                  content = f.read()
              
              if 'onCreate' in content:
                  old = '.method public onCreate(Landroid/os/Bundle;)V'
                  new = '.method public onCreate(Landroid/os/Bundle;)V\n    .locals 2\n    invoke-static {}, Lcom/deathlantern/ModLoader;->loadMod()V'
                  content = content.replace(old, new)
                  
                  with open(smali_file, 'w') as f:
                      f.write(content)
                  print(f"Patched: {smali_file}")
          PATCH
          
          echo "All smali patches applied"
      
      - name: Recompile APK
        run: |
          java -jar /usr/local/bin/apktool.jar b temp/decompiled -o output/unsigned.apk --use-aapt2
          echo "Recompiled successfully"
          ls -lh output/unsigned.apk
      
      - name: Sign APK
        run: |
          # Generate debug keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias deathlantern \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass deathlantern \
            -keypass deathlantern \
            -dname "CN=DeathLantern,O=Mod,C=KR"
          
          # Sign with apksigner (v2 signing)
          zipalign -f 4 output/unsigned.apk output/aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:deathlantern --key-pass pass:deathlantern --out output/hunter-raid-mod-v2.7.1.apk output/aligned.apk
          
          echo "Signed successfully"
          ls -lh output/
      
      - name: Verify APK
        run: |
          apksigner verify --print-certs output/hunter-raid-mod-v2.7.1.apk
          echo "APK verified!"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HunterRaid-Mod-v2.7.1-DeathLantern
          path: output/hunter-raid-mod-v2.7.1.apk
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.1-mod
          name: "Hunter Raid v2.7.1 Mod - DeathLantern"
          body: |
            ## 헌터키우기 모딩 APK v2.7.1
            ### DeathLantern Edition
            
            **v2.6.9 모딩 코드 → v2.7.1 이식 완료**
            
            ### 변경사항
            - libDeathLantern.so 삽입 (런타임 훅)
            - DEX 수정 (모드 로딩 코드 추가)
            - Split APK → 단일 APK 병합
            - 커스텀 서명
            
            ### 설치 방법
            1. 기존 앱 삭제
            2. APK 설치
            3. 출처를 알 수 없는 앱 허용 필요
            
            > ⚠️ 이 APK는 서명이 변경되어 원본 데이터와 호환되지 않습니다.
          files: output/hunter-raid-mod-v2.7.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
