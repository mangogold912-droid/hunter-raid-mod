name: Build Modded APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Install tools
        run: |
          wget -q "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar" -O /usr/local/bin/apktool.jar || true
      
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp output
          gh release download v2.6.9-mod --repo mangogold912-droid/hunter-raid-mod -p 'base.apk' -D temp/ || true
          mv temp/base.apk temp/studio.gameberry.idlehunter.apk 2>/dev/null || true
          gh release download v2.6.9-mod --repo mangogold912-droid/hunter-raid-mod -p 'config.arm64_v8a.apk' -D temp/ || true
          gh release download v2.6.9-mod --repo mangogold912-droid/hunter-raid-mod -p 'libDeathLantern.so' || true
      
      - name: Merge APKs
        run: |
          python3 -c "
          import zipfile, os
          config_libs = {}
          with zipfile.ZipFile('temp/config.arm64_v8a.apk','r') as z:
              for n in z.namelist():
                  if n.startswith('lib/arm64-v8a/'):
                      config_libs[n] = z.read(n)
          with open('libDeathLantern.so','rb') as f:
              config_libs['lib/arm64-v8a/libDeathLantern.so'] = f.read()
          with zipfile.ZipFile('temp/studio.gameberry.idlehunter.apk','r') as zin:
              with zipfile.ZipFile('temp/merged.apk','w',zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.namelist():
                      zout.writestr(item, zin.read(item))
                  for n,d in config_libs.items():
                      zout.writestr(n, d)
          print(f'Merged: {os.path.getsize("temp/merged.apk")//1024//1024}MB')
          "
      
      - name: Decompile and fix manifest
        run: |
          java -jar /usr/local/bin/apktool.jar d temp/merged.apk -o temp/decompiled -f || true
          
          # Create apktool.yml
          cat > temp/decompiled/apktool.yml << 'YML'
          !!brut.androlib.apktool.MetaInfo
          apkFileName: merged.apk
          doNotCompress:
            - resources.arsc
            - assets/bin/Data/Managed/Metadata/global-metadata.dat
            - png
          isFrameworkApk: false
          packageInfo:
            forcedPackageId: '127'
            renameManifestPackage: null
          sdkInfo:
            minSdkVersion: '24'
            targetSdkVersion: '35'
          sharedLibrary: false
          sparseResources: false
          unknownFiles: {}
          usesFramework:
            ids:
            - 1
            tag: null
          version: 2.9.3
          versionInfo:
            versionCode: '286'
            versionName: 2.7.1
          YML
          
          # FIX: Remove split APK dependencies from AndroidManifest.xml
          sed -i 's/ android:requiredSplitTypes="[^"]*"//g' temp/decompiled/AndroidManifest.xml
          sed -i 's/ android:splitTypes="[^"]*"//g' temp/decompiled/AndroidManifest.xml
          sed -i '/com\.android\.vending\.splits\.required/d' temp/decompiled/AndroidManifest.xml
          sed -i '/com\.android\.vending\.splits"/d' temp/decompiled/AndroidManifest.xml
          echo "Manifest fixed!"
      
      - name: Create ModLoader smali
        run: |
          mkdir -p temp/decompiled/smali/com/deathlantern
          cat > temp/decompiled/smali/com/deathlantern/ModLoader.smali << 'SMALI'
          .class public Lcom/deathlantern/ModLoader;
          .super Ljava/lang/Object;
          .method public constructor <init>()V
              .registers 1
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method
          .method public static loadMod()V
              .registers 1
              const-string v0, "DeathLantern"
              invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V
              return-void
          .end method
          SMALI
          
          # Patch activities
          for f in $(find temp/decompiled/smali* -name "MessagingUnityPlayerActivity.smali" -o -name "UnityPlayerActivity.smali" 2>/dev/null); do
            if grep -q "onCreate" "$f" && ! grep -q "loadMod" "$f"; then
              echo "Patching $f..."
              sed -i 's/\.method public onCreate(Landroid\/os\/Bundle;)V/\.method public onCreate(Landroid\/os\/Bundle;)V\n    .registers 2\n\n    invoke-static {}, Lcom\/deathlantern\/ModLoader;->loadMod()V/' "$f"
            fi
          done
      
      - name: Build and sign
        run: |
          java -jar /usr/local/bin/apktool.jar b temp/decompiled -o output/unsigned.apk --use-aapt2 || {
            echo "apktool failed, using direct merge"
            cp temp/merged.apk output/unsigned.apk
          }
          
          keytool -genkeypair -v -keystore debug.keystore -alias deathlantern \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass deathlantern -keypass deathlantern \
            -dname "CN=DeathLantern,O=Mod,C=KR"
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore -storepass deathlantern -keypass deathlantern \
            output/unsigned.apk deathlantern
          
          mv output/unsigned.apk output/hunter-raid-mod-v2.7.1.apk
          ls -lh output/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HunterRaid-Mod-v2.7.1-DeathLantern
          path: output/hunter-raid-mod-v2.7.1.apk
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.1-mod
          name: "Hunter Raid v2.7.1 Mod - DeathLantern"
          files: output/hunter-raid-mod-v2.7.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
